[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "museu-multimodal"
version = "0.1.0"
description = "Recuperação Multimodal de Informações para o Acervo Digital do Museu Nacional (TCC CEFET/RJ)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ingestion*", "evaluation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

